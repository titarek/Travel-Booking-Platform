services:
  - type: web
    name: travel-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: travel-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        sync: false
      - key: ADMIN_ORIGIN
        sync: false
      - key: AMADEUS_CLIENT_ID
        sync: false
      - key: AMADEUS_CLIENT_SECRET
        sync: false
      - key: AVIATIONSTACK_KEY
        sync: false
      - key: EXCHANGE_RATE_API_KEY
        sync: false
      - key: UNSPLASH_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        value: sk_test_51MzTravelBookingGatewayLiveTestKey8821

databases:
  - name: travel-db
    plan: free
    region: oregon
    databaseName: travel_db
    user: travel_user

